# ─────────────────────────────────────────────────────────────
# Apple Intelligence / Siri 分流规则（最终整理版）
# 适用: Siri 语言 = 国语(台湾)；Siri 扩展 = ChatGPT
# 基础: https://github.com/byx020119/Shadowrocket-Siri
# 补充: https://github.com/Kianuni/AppleFlow
#
# 部署要求
#   1. 全部规则指向同一代理策略组（受支持区域，建议台湾/美国/新加坡）
#   2. 节点须转发 UDP 443，PCC 的 OHTTP 依赖 QUIC，勿启用 QUIC-BLOCK
#   3. 本文件须置于 ai.conf、Apple_All、GEOIP,CN 直连规则之前
#   4. 台湾国语 Siri 需走代理，勿套用大陆 Siri 的 DIRECT + skip-proxy 方案
# ─────────────────────────────────────────────────────────────

# ── 1. Siri 语音服务 ─────────────────────────────────────────
# 语音网关与语音识别；落回大陆 IP 会报「我碰到了一点问题」
DOMAIN,api-siri-prod.apple.com
DOMAIN,dejavu.apple.com
DOMAIN,guzzoni.apple.com
DOMAIN,sequoia.apple.com
DOMAIN-SUFFIX,siri.apple.com

# ── 2. Apple 智能 PCC 隐私云计算 ─────────────────────────────
# 缺此区则相册「高质量消除」报 PrivateCloudComputeError Code=32033
DOMAIN,mask-api.fe.apple-dns.net
DOMAIN,mask-api.fe2.apple-dns.net
DOMAIN,mask-api.icloud.com
DOMAIN,mask-t.apple-dns.net
DOMAIN-SUFFIX,app.apple.com
DOMAIN-SUFFIX,issuer.apple.com
DOMAIN-SUFFIX,mask-h2.icloud.com
DOMAIN-SUFFIX,mask.apple-dns.net
DOMAIN-SUFFIX,mask.icloud.com
DOMAIN-SUFFIX,ropes.apple.com

# ── 3. Apple 智能中继 (OHTTP Relay) ──────────────────────────
DOMAIN,apple-carry-relay.cloudflare.com
DOMAIN,apple-relay.akamaized.net
DOMAIN,cp4.cloudflare.com
DOMAIN-SUFFIX,apple-relay.apple.com
DOMAIN-SUFFIX,apple-relay.cloudflare.com
DOMAIN-SUFFIX,apple-relay.fastly-edge.com

# ── 4. 区域与定位准入校验 ────────────────────────────────────
# iOS 27.2+ 对此域启用证书固定，禁止 MitM 解密
DOMAIN,gspe1-ssl.ls.apple.com

# ── 5. Siri 搜索与 Spotlight ─────────────────────────────────
DOMAIN-SUFFIX,smoot.apple.com

# ── 6. Apple 网络基础服务 ────────────────────────────────────
DOMAIN,gateway.icloud.com
DOMAIN,metrics.icloud.com
DOMAIN,probe.icloud.com

# ── 7. Siri ChatGPT 扩展（ai.conf 未覆盖部分）─────────────────
DOMAIN-SUFFIX,chatgpt.livekit.cloud
DOMAIN-SUFFIX,host.livekit.cloud
DOMAIN-SUFFIX,oaistatsig.com
DOMAIN-SUFFIX,oaiusercontent.com
DOMAIN-SUFFIX,turn.livekit.cloud

# ── 8. 兜底关键字 ────────────────────────────────────────────
DOMAIN-KEYWORD,apple-intelligence
